version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      # Keep type definitions aligned with the supported Node.js version (24) and avoid untested major bumps.
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
      - { dependency-name: "vitest", update-types: ["version-update:semver-major"] }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: weekly } }
